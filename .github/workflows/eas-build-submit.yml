name: EAS Build & Submit (iOS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-submit:
    name: Build & Submit to App Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm install --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS (production)
        working-directory: apps/mobile
        id: build
        run: |
          BUILD_ID=$(eas build --platform ios --profile production --non-interactive --json --no-wait | jq -r '.[0].id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          eas build:wait --id $BUILD_ID

      - name: Submit to App Store
        working-directory: apps/mobile
        run: eas submit --platform ios --profile production --non-interactive --id ${{ steps.build.outputs.build_id }}
